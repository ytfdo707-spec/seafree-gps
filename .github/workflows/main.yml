name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip project
        run: unzip -q SeaFreeGPS-stage1.zip

      - name: Build debug APK
        run: gradle -p SeaFreeGPS assembleDebug --no-daemon

      - name: Run unit tests
        run: gradle -p SeaFreeGPS testDebugUnitTest --no-daemon
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: SeaFreeGPS-debug-apk
          path: SeaFreeGPS/app/build/outputs/apk/debug/app-debug.apk
